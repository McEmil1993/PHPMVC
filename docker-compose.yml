services:
  php-mvc:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-172.26.192.1}
      DB_PORT: ${DB_PORT:-3309}
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-newuser1}
      DB_PASSWORD: ${DB_PASSWORD:-newuser123qwe!}

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - php-mvc
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
